<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EVALO</title>
<style>
:root{--deep:#0E2A49;--ink:#12355B;--ink2:#1F4E80;--sky:#8FD3F4;--mist:#EAF4FB;--paper:#F4F7FB;--card:#fff;--text:#14212F;--mute:#5F7285;--line:#D9E4EE;--ok:#1F9D6B;--bad:#D64550;--amber:#F2A93B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--paper);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 14px;border-radius:0 0 22px 22px;display:flex;align-items:center;gap:12px}
header svg{width:36px;height:36px;flex:none}
header b{font-size:19px;font-weight:800;letter-spacing:2px;display:block;line-height:1.1}
header span{color:var(--sky);font-size:12.5px}
main{flex:1;overflow:auto;padding:16px 16px 24px}
nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 2px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{flex:1;border:0;background:none;color:var(--mute);font:600 11px system-ui;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink);background:var(--mist)}
h2{margin:4px 0 12px;font-size:18px}
.hero{position:relative;overflow:hidden;color:#fff;margin:-16px -16px 18px;padding:calc(env(safe-area-inset-top,0px) + 30px) 22px 24px;border-radius:0 0 30px 30px;background:radial-gradient(circle at 88% 8%,rgba(143,211,244,.38),transparent 42%),radial-gradient(circle at 5% 100%,rgba(242,169,59,.22),transparent 38%),linear-gradient(165deg,var(--deep),var(--ink2))}
.hero svg.lg{width:58px;height:58px;box-shadow:0 8px 22px rgba(0,0,0,.3);border-radius:16px}
.hero h1{margin:14px 0 4px;font-size:40px;font-weight:900;letter-spacing:5px;line-height:1}
.hero p{margin:0;color:var(--sky);font-size:15px;max-width:260px}
.hero .bars{position:absolute;right:18px;top:calc(env(safe-area-inset-top,0px) + 34px);display:flex;align-items:flex-end;gap:6px;height:70px;opacity:.9}
.hero .bars i{width:10px;border-radius:4px;background:linear-gradient(var(--sky),rgba(143,211,244,.25))}
.hstat{display:flex;gap:8px;margin-top:20px}
.hstat div{flex:1;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 6px;text-align:center}
.hstat b{display:block;font-size:22px}
.hstat span{font-size:12px;color:var(--sky)}
.credit{text-align:center;color:var(--mute);font-size:12.5px;margin:22px 0 4px}
.credit b{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.title{font-weight:650}
.sub{color:var(--mute);font-size:13px}
.btn{border:0;border-radius:12px;padding:11px 16px;font:600 14px system-ui;background:var(--ink);color:#fff}
.btn.alt{background:var(--mist);color:var(--ink)}
.btn.ghost{background:none;color:var(--bad);padding:8px}
.btn.sm{padding:8px 12px;font-size:13px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sel{outline:2px solid var(--ink2);background:var(--mist)}
.empty{text-align:center;color:var(--mute);padding:34px 12px;border:1.5px dashed var(--line);border-radius:14px}
input,select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font:inherit;background:#fff;color:var(--text)}
input:focus,select:focus{outline:2px solid var(--sky);border-color:var(--ink2)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:14px;background:#fff}
table{border-collapse:separate;border-spacing:0;font-size:13px}
th{background:var(--sky);color:var(--ink);padding:8px 6px;font-weight:700;border-bottom:1px solid #fff;white-space:nowrap}
td{padding:4px;border-bottom:1px solid var(--line);text-align:center}
td.n{position:sticky;left:0;background:#fff;text-align:left;padding:8px 10px;min-width:130px;font-weight:600;z-index:1;border-right:1px solid var(--line)}
th.n{position:sticky;left:0;z-index:2;text-align:left}
td input{width:52px;padding:7px 2px;text-align:center;border-radius:8px}
td.nr{font-weight:800;color:var(--ink);min-width:44px;background:var(--mist)}
.modal{position:fixed;inset:0;background:rgba(10,25,45,.55);display:flex;align-items:flex-end;z-index:9}
.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px)}
.sheet label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:10}
.stat{display:flex;gap:8px;margin-bottom:14px}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--ink)}
.stat span{font-size:12px;color:var(--mute)}
.bar{height:9px;border-radius:6px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:6px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
.g{background:#DDF4EA;color:#15734E}.y{background:#FDEFD3;color:#8A5A07}.r{background:#FADDE0;color:#A62B36}.z{background:#E8EDF2;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12px;font-weight:700;padding:4px 9px;border-radius:9px}
.desc{font-size:13px;color:var(--text);background:var(--paper);border-radius:10px;padding:9px 11px}
.seg{display:flex;background:var(--mist);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px;border-radius:9px;font:600 14px system-ui;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.arow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.arow span{flex:1;font-size:14px}
.lvs{display:flex;gap:5px}
.lv{min-width:40px;border:1.5px solid var(--line);background:#fff;color:var(--mute);border-radius:9px;padding:7px 0;font:700 12px system-ui}
.lv.on{color:#fff;border-color:transparent}.lv.l4{background:var(--ok)}.lv.l3{background:var(--ink2)}.lv.l2{background:var(--amber)}.lv.l1{background:var(--bad)}
.lv:not(.on){background:#fff;color:var(--mute)}
.b{background:#DCEBF8;color:#1F4E80}
.subnav{overflow-x:auto;gap:2px}.subnav button{white-space:nowrap;padding:9px 12px}
.fl{display:block;font-weight:600;font-size:13px;margin:10px 0 4px;color:var(--mute)}
.pbtn{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.14);color:#fff;border-radius:20px;padding:7px 15px;font:600 13px system-ui;margin-top:16px}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:24px;background:radial-gradient(circle at 80% 15%,rgba(143,211,244,.4),transparent 45%),linear-gradient(165deg,var(--deep),var(--ink2));transition:opacity .6s,visibility .6s}
#splash.out{opacity:0;visibility:hidden}
#splash svg{width:96px;height:96px;border-radius:26px;box-shadow:0 14px 40px rgba(0,0,0,.4);animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
#splash h1{margin:22px 0 8px;font-size:46px;font-weight:900;letter-spacing:9px;padding-left:9px;animation:rise .7s .35s both}
#splash p{margin:0;color:var(--sky);font-size:16px;max-width:280px;animation:rise .7s .6s both}
#splash small{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);color:rgba(255,255,255,.7);font-size:13px;animation:rise .7s .9s both}
@keyframes pop{from{transform:scale(.4) rotate(-12deg);opacity:0}}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
</style>
</head>
<body>
<div id="splash"></div>
<div id="app">
  <header id="hd"></header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<input type="file" id="file" accept=".xlsx,.xls,.csv" hidden>
<script src="xlsx.full.min.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="jspdf.plugin.autotable.min.js"></script>
<script>
/* ===== Data ===== */
const TAG='Siap Menilai kapan saja dan Di mana saja',CREDIT='Dikembangkan oleh Niko EA, M.Pd',NF=6;
let db;
try{db=JSON.parse(localStorage.getItem('nilai_db'))}catch(e){}
db=db||{kelas:[],siswa:[],mapel:[],nilai:{},aktif:null,tab:'kelas',mapelAktif:null};
db.sikap=db.sikap||{};
const save=()=>{try{localStorage.setItem('nilai_db',JSON.stringify(db))}catch(e){toast('Gagal menyimpan data')}};
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kelasList=()=>db.kelas.filter(k=>k.pid===db.pAktif);
const kelasAktif=()=>kelasList().find(k=>k.id===db.aktif);
const periodeAktif=()=>db.periode.find(p=>p.id===db.pAktif)||db.periode[0];
const periodeLabel=p=>{p=p||periodeAktif();return 'Semester '+p.sem+' '+p.tahun};
const siswaKelas=()=>db.siswa.filter(s=>s.kelasId===db.aktif).sort((a,b)=>a.nama.localeCompare(b.nama));
const mapelKelas=()=>db.mapel.filter(m=>m.kelasId===db.aktif);
const getN=(m,s)=>db.nilai[m+'|'+s]||{f:[],t:[]};
const num=v=>(v===''||v==null||isNaN(v))?null:+v;
const tpName=(m,i)=>(m.tp[i]||'').trim()||'TP'+(i+1);
let fileMode='siswa';
const hariIni=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const tglIndo=d=>(d?new Date(d):new Date()).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'});
const sheetNm=t=>t.replace(/[\\\/\?\*\[\]:]/g,'').slice(0,28);
function presRekap(kid,sid){const c={H:0,S:0,I:0,A:0},P=db.pres[kid]||{};Object.values(P).forEach(d=>{if(d[sid])c[d[sid]]++});return c}
function migrasi(){
  db.kelas=db.kelas||[];db.siswa=db.siswa||[];db.mapel=db.mapel||[];db.nilai=db.nilai||{};
  db.sikap=db.sikap||{};db.pres=db.pres||{};db.profil=db.profil||{};db.periode=db.periode||[];db.lastTab=db.lastTab||{};
  if(!db.periode.length){const t=new Date(),y=t.getFullYear(),g=t.getMonth()>=6;const pr={id:uid(),tahun:g?y+'/'+(y+1):(y-1)+'/'+y,sem:g?'Ganjil':'Genap'};db.periode.push(pr);db.pAktif=pr.id}
  if(!db.periode.find(x=>x.id===db.pAktif))db.pAktif=db.periode[0].id;
  db.kelas.forEach(k=>{if(!k.pid)k.pid=db.periode[0].id});
  if(!kelasAktif())db.aktif=kelasList()[0]?.id||null;
}
function hapusKelas(id){
  db.mapel.filter(m=>m.kelasId===id).forEach(m=>Object.keys(db.nilai).forEach(k=>k.startsWith(m.id+'|')&&delete db.nilai[k]));
  db.siswa.filter(x=>x.kelasId===id).forEach(x=>delete db.sikap[x.id]);
  delete db.pres[id];
  db.siswa=db.siswa.filter(x=>x.kelasId!==id);db.mapel=db.mapel.filter(m=>m.kelasId!==id);db.kelas=db.kelas.filter(k=>k.id!==id);
}
function bukaPeriode(tahun,sem,salin){
  const pr={id:uid(),tahun,sem};db.periode.push(pr);
  if(salin)kelasList().forEach(k=>{
    const nk={id:uid(),nama:k.nama,pid:pr.id,aspek:(k.aspek||[]).map(a=>({id:uid(),nama:a.nama}))};
    db.siswa.filter(x=>x.kelasId===k.id).forEach(x=>db.siswa.push({id:uid(),kelasId:nk.id,nama:x.nama}));
    db.mapel.filter(m=>m.kelasId===k.id).forEach(m=>db.mapel.push({id:uid(),kelasId:nk.id,nama:m.nama,tp:[...m.tp],kktp:m.kktp||75}));
    db.kelas.push(nk);
  });
  db.pAktif=pr.id;db.aktif=kelasList()[0]?.id||null;db.mapelAktif=null;save();render();
}
function modalPeriode(){
  document.querySelector('.modal')?.remove();
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="sheet"><h2>Tahun ajaran dan semester</h2>${db.periode.map(x=>`<div class="row" style="margin-bottom:8px"><button class="btn ${x.id===db.pAktif?'':'alt'} grow" style="text-align:left" data-set-periode="${x.id}">${periodeLabel(x)}${x.id===db.pAktif?' (aktif)':''}</button>${db.periode.length>1?`<button class="btn ghost sm" data-del-periode="${x.id}">Hapus</button>`:''}</div>`).join('')}
  <button class="btn" style="width:100%;margin-top:6px" data-add-periode>+ Periode baru</button></div>`;
  m.onclick=e=>{if(e.target===m)m.remove()};
  document.body.appendChild(m);
}
const LV={4:['SB','Sangat Baik','g'],3:['B','Baik','b'],2:['C','Cukup','y'],1:['PB','Perlu Bimbingan','r']};
const DEF_ASPEK=['Religius','Disiplin','Jujur','Tanggung jawab','Gotong royong','Santun'];
function aspekKelas(kid){const k=db.kelas.find(x=>x.id===kid);if(!k.aspek){k.aspek=DEF_ASPEK.map(n=>({id:uid(),nama:n}));save()}return k.aspek}
const getS=sid=>db.sikap[sid]||{};
function sikapInfo(kid,sid){
  const as=aspekKelas(kid),d=getS(sid),g={4:[],3:[],2:[],1:[]};let tot=0,n=0;
  as.forEach(a=>{const v=d[a.id];if(v){g[v].push(a.nama);tot+=v;n++}});
  const avg=n?tot/n:null,p=avg===null?null:avg>=3.5?4:avg>=2.5?3:avg>=1.5?2:1,parts=[];
  [4,3,2,1].forEach(l=>g[l].length&&parts.push(LV[l][1]+': '+g[l].join(', ')));
  let desk=parts.join('. ');if(d.cat)desk+=(desk?'. ':'')+d.cat;
  return{p,desk:desk||'Belum dinilai.'};
}
const LOGO=`<svg viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#8FD3F4"/><rect x="10" y="26" width="6" height="12" rx="2" fill="#12355B"/><rect x="21" y="19" width="6" height="19" rx="2" fill="#12355B"/><rect x="32" y="11" width="6" height="27" rx="2" fill="#12355B"/><path d="M9 18l8-6 6 4 9-8" stroke="#F2A93B" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
/* Opsi Rata-rata: NR = rata-rata semua nilai sumatif (semua TP, STS, SAS) yang terisi. Formatif tidak masuk NR. */
function hitungNR(n){
  const a=[...(n.t||[]),n.sts,n.sas].map(num).filter(x=>x!==null);
  return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):'';
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}

/* ===== Analisis capaian ===== */
function analisis(m){
  const sl=siswaKelas(),K=m.kktp||75;
  return m.tp.map((_,i)=>{
    const v=sl.map(s=>num(getN(m.id,s.id).t[i])).filter(x=>x!==null);
    const avg=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10:null;
    const p=v.length?Math.round(v.filter(x=>x>=K).length/v.length*100):null;
    const kat=p===null?'Belum ada nilai':p>=75?'Tercapai':p>=50?'Cukup':'Perlu penguatan';
    return{i,avg,n:v.length,p,kat,c:p===null?'z':p>=75?'g':p>=50?'y':'r'};
  });
}
function deskripsi(m,s){
  const K=m.kktp||75,n=getN(m.id,s.id),ok=[],no=[];
  m.tp.forEach((_,i)=>{const v=num(n.t[i]);if(v===null)return;(v>=K?ok:no).push(tpName(m,i))});
  let d='';if(ok.length)d+='Sudah mencapai: '+ok.join('; ')+'. ';if(no.length)d+='Perlu bimbingan pada: '+no.join('; ')+'.';
  return d.trim()||'Belum ada nilai sumatif TP.';
}

/* ===== Dialog input ===== */
function ask(title,fields,ok){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="sheet"><h2>${esc(title)}</h2>${fields.map((f,i)=>`<label>${esc(f.label)}</label><input data-i="${i}" value="${esc(f.value||'')}" placeholder="${esc(f.ph||'')}">`).join('')}
  <div class="btns" style="margin:16px 0 0"><button class="btn alt" data-x>Batal</button><button class="btn" data-ok>Simpan</button></div></div>`;
  document.body.appendChild(m);
  const first=m.querySelector('input');setTimeout(()=>first.focus(),50);
  m.onclick=e=>{
    if(e.target===m||e.target.dataset.x!==undefined)m.remove();
    if(e.target.dataset.ok!==undefined){
      const v=[...m.querySelectorAll('input')].map(i=>i.value.trim());
      if(!v[0]){toast('Isi kolom pertama dulu');return}
      m.remove();ok(v);
    }
  };
}

/* ===== Tampilan ===== */
const ICON={
  kelas:'<path d="M3 11l9-8 9 8M5 9.5V21h14V9.5M10 21v-6h4v6"/>',
  siswa:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.3-5.5 6.5-5.5s5.9 2 6.5 5.5M17 5a3.5 3.5 0 0 1 0 6.5M21.5 20c-.4-2.4-1.7-4-3.5-4.8"/>',
  mapel:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5zM4 21.5A2.5 2.5 0 0 0 6.5 24H20"/>',
  nilai:'<path d="M4 20h16M7 20V10m5 10V4m5 16v-7"/>',
  sikap:'<path d="M12 21s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 11c0 5.6-7 10-7 10z"/>',
  analisis:'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
  ekspor:'<path d="M12 3v12m0 0l-4-4m4 4l4-4M4 17v3h16v-3"/>'
};
const GROUPS=[{n:'Beranda',i:'kelas',t:[['kelas','Beranda']]},{n:'Data',i:'siswa',t:[['siswa','Siswa'],['mapel','Mapel & TP']]},{n:'Nilai',i:'nilai',t:[['nilai','Nilai'],['sikap','Sikap'],['presensi','Presensi']]},{n:'Laporan',i:'analisis',t:[['analisis','Analisis'],['rapor','Rapor'],['ekspor','Ekspor & cadangan']]}];
const grpOf=t=>GROUPS.findIndex(g=>g.t.some(x=>x[0]===t));
function render(){
  const st=$('#main').scrollTop;
  if(grpOf(db.tab)<0)db.tab='kelas';
  const gi=grpOf(db.tab),g=GROUPS[gi];db.lastTab[g.n]=db.tab;
  $('#nav').innerHTML=GROUPS.map((x,i)=>`<button class="${i===gi?'on':''}" data-grp="${i}"><svg viewBox="0 0 24 24">${ICON[x.i]}</svg>${x.n}</button>`).join('');
  const k=kelasAktif();
  $('#hd').style.display=db.tab==='kelas'?'none':'flex';
  $('#hd').innerHTML=`${LOGO}<div><b>EVALO</b><span>${k?'Kelas '+esc(k.nama)+', '+periodeLabel():'Belum ada kelas aktif'}</span></div>`;
  const sub=g.t.length>1?`<div class="seg subnav">${g.t.map(([key,l])=>`<button class="${db.tab===key?'on':''}" data-tab="${key}">${l}</button>`).join('')}</div>`:'';
  const needClass=!['kelas','ekspor'].includes(db.tab)&&!k;
  $('#main').innerHTML=sub+(needClass?`<div class="empty">Belum ada kelas aktif.<br>Buat atau pilih kelas di tab Beranda.</div>`:VIEW[db.tab]());
  $('#main').scrollTop=st;
}
const VIEW={
kelas(){
  const kl=kelasList(),ids=new Set(kl.map(k=>k.id));
  const nS=db.siswa.filter(x=>ids.has(x.kelasId)).length,nM=db.mapel.filter(x=>ids.has(x.kelasId)).length;
  const list=kl.map(k=>`<div class="card row ${k.id===db.aktif?'sel':''}" data-pilih="${k.id}">

  ${list||'<div class="empty">Belum ada kelas di periode ini.<br>Mulai dengan menambah kelas, misalnya VII A atau 5B.</div>'}

siswa(){

},
mapel(){

nilai(){

sikap(){

},
presensi(){
  const k=kelasAktif(),sl=siswaKelas(),mode=db.presMode==='rekap'?'rekap':'input';
  const seg=`<div class="seg"><button class="${mode==='input'?'on':''}" data-pres-mode="input">Input harian</button><button class="${mode==='rekap'?'on':''}" data-pres-mode="rekap">Rekap</button></div>`;

  ${sl.map((x,i)=>`<div class="card row"><div class="grow title">${i+1}. ${esc(x.nama)}</div><div class="lvs">${btn.map(([c,l])=>`<button class="lv ${d[x.id]===c?'on l'+l:''}" data-ps="${x.id}|${c}">${c}</button>`).join('')}</div></div>`).join('')}
  <p class="sub">H = Hadir, S = Sakit, I = Izin, A = Alpa</p>`;
},
rapor(){
  const k=kelasAktif(),sl=siswaKelas(),pf=db.profil,ml=mapelKelas();
  const F=(key,label,ph)=>`<label class="fl">${label}</label><input data-prof="${key}" value="${esc(pf[key]||'')}" placeholder="${ph||''}">`;
  return `<div class="card"><div class="title">Data rapor</div><p class="sub">Diisi sekali, dipakai untuk semua rapor.</p>${F('sekolah','Nama sekolah','Nama sekolah Anda')}${F('kota','Kota penerbitan rapor','Palembang')}${F('guru','Nama wali kelas')}${F('nipguru','NIP wali kelas')}${F('kepsek','Nama kepala sekolah')}${F('nipkepsek','NIP kepala sekolah')}</div>
  <div class="card"><div class="title">Cetak rapor kelas ${esc(k.nama)}</div><p class="sub">${ml.length} mapel, ${sl.length} siswa. Isi rapor: nilai akhir dan capaian kompetensi per mapel, sikap, dan kehadiran.</p>
  <select data-rapor-siswa style="margin:10px 0 12px"><option value="all">Semua siswa (1 file, 1 halaman per siswa)</option>${sl.map(x=>`<option value="${x.id}" ${db.raporSiswa===x.id?'selected':''}>${esc(x.nama)}</option>`).join('')}</select>
  <button class="btn" data-buat-rapor>Buat PDF rapor</button></div>`;
},
analisis(){
  const ml=mapelKelas();
  if(!ml.length)return `<div class="empty">Buat mata pelajaran dan TP dulu di tab Mapel.</div>`;
  const m=pilihMapel(ml),sl=siswaKelas(),K=m.kktp||75;
  if(!sl.length||!m.tp.length)return mapelSelect(ml,m)+`<div class="empty">Analisis butuh minimal 1 siswa dan 1 TP.</div>`;
  const an=analisis(m),nrs=sl.map(s=>hitungNR(getN(m.id,s.id))).filter(x=>x!=='');
  const rata=nrs.length?Math.round(nrs.reduce((a,b)=>a+b,0)/nrs.length):'-',tuntas=nrs.filter(x=>x>=K).length;
  const col={g:'var(--ok)',y:'var(--amber)',r:'var(--bad)',z:'var(--line)'};
  return `${mapelSelect(ml,m)}
  <div class="card row"><div class="grow"><div class="title">Batas ketercapaian (KKTP)</div><div class="sub">Nilai minimal TP dianggap tercapai</div></div><input type="number" min="0" max="100" data-kktp value="${K}" style="width:80px;text-align:center"></div>
  <div class="stat"><div><b>${rata}</b><span>Rata-rata NR</span></div><div><b>${tuntas}/${nrs.length}</b><span>NR ≥ ${K}</span></div></div>
  <h2>Capaian per TP</h2>
  ${an.map(a=>`<div class="card"><div class="row"><div class="grow"><div class="title">TP${a.i+1}</div><div class="sub">${esc(m.tp[a.i]||'(belum diisi)')}</div></div><span class="pill ${a.c}">${a.kat}</span></div>
  <div class="bar"><i style="width:${a.p||0}%;background:${col[a.c]}"></i></div><div class="sub">${a.p===null?'Belum ada nilai':`${a.p}% siswa mencapai, rata-rata ${a.avg}, ${a.n} siswa dinilai`}</div></div>`).join('')}
  <h2 style="margin-top:18px">Capaian per siswa</h2>
  ${sl.map(s=>{const n=getN(m.id,s.id);return `<div class="card"><div class="row"><div class="grow title">${esc(s.nama)}</div><span class="pill z">NR ${hitungNR(n)||'-'}</span></div>
  <div class="chips">${m.tp.map((_,i)=>{const v=num(n.t[i]);return `<span class="chip ${v===null?'z':v>=K?'g':'r'}">TP${i+1}: ${v===null?'-':v}</span>`}).join('')}</div><div class="desc">${esc(deskripsi(m,s))}</div></div>`}).join('')}`;
},
ekspor(){
  return `<h2>Ekspor ke Excel</h2><div class="card"><div class="title">Rekap nilai raport</div><p class="sub">Satu sheet per mata pelajaran: Formatif 1–6, Sumatif semua TP, STS, SAS, NR, deskripsi capaian, analisis ketercapaian TP, penilaian sikap, dan presensi.</p>
  <div class="btns" style="margin:0"><button class="btn" data-export="all">Semua kelas</button>${kelasAktif()?`<button class="btn alt" data-export="aktif">Kelas ${esc(kelasAktif().nama)}</button>`:''}</div></div>
  <div class="card"><div class="title">Cadangan data</div><p class="sub">${db.lastBackup?'Terakhir dicadangkan: '+tglIndo(db.lastBackup)+'.':'Belum pernah dicadangkan.'} File cadangan berisi seluruh data (semua periode) dan bisa dipulihkan di HP baru.</p><div class="btns" style="margin:0"><button class="btn" data-backup>Cadangkan data</button><button class="btn alt" data-restore>Pulihkan dari file</button></div></div>
  <div class="credit"><b>EVALO</b><br>${TAG}<br>${CREDIT}</div>`;
}};
function pilihMapel(ml){if(!ml.find(m=>m.id===db.mapelAktif))db.mapelAktif=ml[0].id;return ml.find(m=>m.id===db.mapelAktif)}
const mapelSelect=(ml,m)=>`<select data-pilih-mapel style="margin-bottom:12px">${ml.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.nama)}</option>`).join('')}</select>`;

/* ===== Aksi ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-pilih]');if(!t)return;const d=t.dataset;
  if(d.tab){db.tab=d.tab;save();render();$('#main').scrollTop=0;return}
  if(d.addKelas!==undefined)return ask('Kelas baru',[{label:'Nama kelas',ph:'VII A'}],([n])=>{const k={id:uid(),nama:n,pid:db.pAktif};db.kelas.push(k);db.aktif=k.id;save();render()});
  if(d.editKelas){const k=db.kelas.find(x=>x.id===d.editKelas);return ask('Ubah kelas',[{label:'Nama kelas',value:k.nama}],([n])=>{k.nama=n;save();render()})}
  if(d.delKelas){if(confirm('Hapus kelas beserta siswa, mapel, nilai, sikap, dan presensinya?')){hapusKelas(d.delKelas);if(db.aktif===d.delKelas)db.aktif=kelasList()[0]?.id||null;save();render()}return}
  if(d.pilih){db.aktif=d.pilih;save();render();return}
  if(d.addSiswa!==undefined)return ask('Siswa baru',[{label:'Nama siswa'}],([n])=>{db.siswa.push({id:uid(),kelasId:db.aktif,nama:n});save();render()});
  if(d.editSiswa){const s=db.siswa.find(x=>x.id===d.editSiswa);return ask('Ubah siswa',[{label:'Nama siswa',value:s.nama}],([n])=>{s.nama=n;save();render()})}
  if(d.delSiswa){if(confirm('Hapus siswa ini beserta nilainya?')){const id=d.delSiswa;Object.keys(db.nilai).forEach(k=>k.endsWith('|'+id)&&delete db.nilai[k]);delete db.sikap[id];db.siswa=db.siswa.filter(s=>s.id!==id);save();render()}return}
  if(d.upload!==undefined){fileMode='siswa';$('#file').accept='.xlsx,.xls,.csv';return $('#file').click()}
  if(d.template!==undefined){const ws=XLSX.utils.aoa_to_sheet([['No','Nama Siswa'],[1,'Contoh Nama Siswa 1'],[2,'Contoh Nama Siswa 2']]);ws['!cols']=[{wch:6},{wch:36}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Siswa');return berkas('template-siswa.xlsx',XLSX.write(wb,{type:'base64',bookType:'xlsx'}))}
  if(d.addMapel!==undefined)return ask('Mata pelajaran baru',[{label:'Nama mata pelajaran',ph:'Matematika'}],([n])=>{db.mapel.push({id:uid(),kelasId:db.aktif,nama:n,tp:[''],kktp:75});save();render()});
  if(d.delMapel){if(confirm('Hapus mata pelajaran beserta nilainya?')){const id=d.delMapel;Object.keys(db.nilai).forEach(k=>k.startsWith(id+'|')&&delete db.nilai[k]);db.mapel=db.mapel.filter(m=>m.id!==id);save();render()}return}
  if(d.addTp){db.mapel.find(m=>m.id===d.addTp).tp.push('');save();render();return}
  if(d.delTp){const[id,i]=d.delTp.split('|'),m=db.mapel.find(x=>x.id===id);
    if(confirm(`Hapus TP${+i+1}? Nilai TP ini ikut terhapus.`)){m.tp.splice(+i,1);Object.keys(db.nilai).forEach(k=>k.startsWith(id+'|')&&db.nilai[k].t&&db.nilai[k].t.splice(+i,1));save();render()}return}
  if(d.sikapMode){db.sikapMode=d.sikapMode;save();render();return}
  if(d.addAspek!==undefined){aspekKelas(db.aktif).push({id:uid(),nama:''});save();render();return}
  if(d.delAspek){if(confirm('Hapus aspek ini beserta nilainya?')){const as=aspekKelas(db.aktif),i=as.findIndex(a=>a.id===d.delAspek);as.splice(i,1);Object.values(db.sikap).forEach(v=>delete v[d.delAspek]);save();render()}return}
  if(d.lv){const[sid,aid,l]=d.lv.split('|'),o=db.sikap[sid]=db.sikap[sid]||{};if(o[aid]===+l)delete o[aid];else o[aid]=+l;save();render();return}
  if(d.isiBaik!==undefined){const as=aspekKelas(db.aktif);siswaKelas().forEach(s=>{const o=db.sikap[s.id]=db.sikap[s.id]||{};as.forEach(a=>{if(!o[a.id])o[a.id]=3})});save();render();toast('Aspek kosong diisi Baik');return}
  if(d.grp!==undefined){const g=GROUPS[+d.grp],l=db.lastTab[g.n];db.tab=g.t.some(x=>x[0]===l)?l:g.t[0][0];save();render();$('#main').scrollTop=0;return}
  if(d.periode!==undefined)return modalPeriode();
  if(d.setPeriode){db.pAktif=d.setPeriode;db.aktif=kelasList()[0]?.id||null;db.mapelAktif=null;save();document.querySelector('.modal')?.remove();render();return}
  if(d.addPeriode!==undefined){document.querySelector('.modal')?.remove();const y=new Date().getFullYear();
    return ask('Periode baru',[{label:'Tahun ajaran',ph:'2026/2027',value:periodeAktif().tahun},{label:'Semester (Ganjil atau Genap)',value:periodeAktif().sem==='Ganjil'?'Genap':'Ganjil'}],([t,sm])=>{
      const salin=kelasList().length>0&&confirm('Salin kelas, siswa, mapel, dan TP dari periode aktif? Nilai tidak ikut disalin.');
      bukaPeriode(t,/gen/i.test(sm||'')?'Genap':'Ganjil',salin)})}
  if(d.delPeriode){if(confirm('Hapus periode ini beserta semua kelas, nilai, sikap, dan presensinya?')){
    db.kelas.filter(k=>k.pid===d.delPeriode).forEach(k=>hapusKelas(k.id));db.periode=db.periode.filter(x=>x.id!==d.delPeriode);
    if(db.pAktif===d.delPeriode){db.pAktif=db.periode[0].id;db.aktif=kelasList()[0]?.id||null}save();document.querySelector('.modal')?.remove();render()}return}
  if(d.presMode){db.presMode=d.presMode;save();render();return}
  if(d.ps){const[sid,c]=d.ps.split('|'),tgl=db.tglPres||hariIni(),P=db.pres[db.aktif]=db.pres[db.aktif]||{},o=P[tgl]=P[tgl]||{};if(o[sid]===c)delete o[sid];else o[sid]=c;save();render();return}
  if(d.semuaHadir!==undefined){const tgl=db.tglPres||hariIni(),P=db.pres[db.aktif]=db.pres[db.aktif]||{},o=P[tgl]=P[tgl]||{};siswaKelas().forEach(x=>{if(!o[x.id])o[x.id]='H'});save();render();toast('Yang kosong diisi Hadir');return}
  if(d.tplNilai!==undefined)return templateNilai();
  if(d.upNilai!==undefined){fileMode='nilai';$('#file').accept='.xlsx,.xls,.csv';return $('#file').click()}
  if(d.backup!==undefined)return cadangkan();
  if(d.restore!==undefined){fileMode='backup';$('#file').accept='';return $('#file').click()}
  if(d.buatRapor!==undefined)return buatRapor();
  if(d.export)return ekspor(d.export==='all');
});
document.addEventListener('change',e=>{
  const d=e.target.dataset;
  if(d.pilihMapel!==undefined){db.mapelAktif=e.target.value;save();render()}
  if(d.tgl!==undefined){db.tglPres=e.target.value||hariIni();save();render()}
  if(d.raporSiswa!==undefined){db.raporSiswa=e.target.value;save()}
  if(d.kktp!==undefined){const m=db.mapel.find(x=>x.id===db.mapelAktif);m.kktp=Math.min(100,Math.max(0,+e.target.value||75));save();render()}
});
document.addEventListener('input',e=>{
  const d=e.target.dataset;
  if(d.tp){const[id,i]=d.tp.split('|');db.mapel.find(m=>m.id===id).tp[+i]=e.target.value;save()}
  if(d.aspek){const a=aspekKelas(db.aktif).find(x=>x.id===d.aspek);a.nama=e.target.value;save()}
  if(d.cat!==undefined){const o=db.sikap[d.cat]=db.sikap[d.cat]||{};o.cat=e.target.value.trim();save();const el=$('#sd-'+d.cat);if(el)el.textContent=sikapInfo(db.aktif,d.cat).desk}
  if(d.prof){db.profil[d.prof]=e.target.value;save()}
  if(d.n){
    const[sid,k]=d.n.split('|');let v=e.target.value;
    if(v!==''&&+v>100){v='100';e.target.value=v}
    const key=db.mapelAktif+'|'+sid;const n=db.nilai[key]=db.nilai[key]||{f:[],t:[]};
    if(k[0]==='f')n.f[+k.slice(1)]=v;else if(k[0]==='t')n.t[+k.slice(1)]=v;else n[k]=v;
    save();const c=$('#nr-'+sid);if(c)c.textContent=hitungNR(n);
  }
});
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;if(fileMode==='backup')return pulihkan(f);if(fileMode==='nilai')return uploadNilai(f);
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    let col=0,start=0;
    for(let i=0;i<Math.min(rows.length,10);i++){const c=rows[i].findIndex(x=>/nama/i.test(String(x)));if(c>=0){col=c;start=i+1;break}}
    const names=rows.slice(start).map(r=>String(r[col]||'').trim()).filter(Boolean);
    const ada=new Set(siswaKelas().map(s=>s.nama.toLowerCase()));let n=0;
    names.forEach(x=>{if(!ada.has(x.toLowerCase())){db.siswa.push({id:uid(),kelasId:db.aktif,nama:x});ada.add(x.toLowerCase());n++}});
    save();render();toast(`${n} siswa ditambahkan`);
  }catch(err){toast('File tidak bisa dibaca')}
});

/* ===== Ekspor Excel ===== */
async function ekspor(semua){
  const ks=semua?kelasList():kelasList().filter(k=>k.id===db.aktif);
  const ms=db.mapel.filter(m=>ks.some(k=>k.id===m.kelasId));
  if(!ms.length&&!ks.some(k=>db.siswa.some(x=>x.kelasId===k.id)))return toast('Belum ada data untuk diekspor');
  const wb=XLSX.utils.book_new(),used=new Set(),R=(n,v='')=>Array(n).fill(v);
  ms.forEach(m=>{
    const k=db.kelas.find(x=>x.id===m.kelasId),sl=db.siswa.filter(s=>s.kelasId===k.id).sort((a,b)=>a.nama.localeCompare(b.nama));
    const T=m.tp.length,K=m.kktp||75,cS=2+NF,cSts=cS+T,cNr=cSts+2,cDesc=cNr+1;
    const h1=['No','Nama Siswa','FORMATIF',...R(NF-1),...(T?['SUMATIF',...R(T-1)]:[]),'STS','SAS','NR','Deskripsi Capaian'];
    const h2=['','',...Array.from({length:NF},(_,i)=>i+1),...m.tp.map((_,i)=>'TP'+(i+1)),'','','',''];
    const aoa=[[`REKAP NILAI RAPORT - ${m.nama}`],[`Kelas: ${k.nama}  |  ${periodeLabel(db.periode.find(x=>x.id===k.pid))}`],[],h1,h2];
    sl.forEach((s,i)=>{const n=getN(m.id,s.id),v=x=>num(x)??'';
      aoa.push([i+1,s.nama,...Array.from({length:NF},(_,j)=>v(n.f[j])),...m.tp.map((_,j)=>v(n.t[j])),v(n.sts),v(n.sas),hitungNR(n),deskripsi(m,s)])});
    aoa.push([],['Ket:'],['Formatif: asesmen untuk meningkatkan kualitas pembelajaran (tidak dijadikan nilai raport)'],['Sumatif: asesmen yang hasilnya dijadikan nilai raport'],['STS: Sumatif Tengah Semester | SAS: Sumatif Akhir Semester'],['NR: rata-rata nilai sumatif (semua TP, STS, SAS)']);
    m.tp.forEach((t,i)=>t&&aoa.push([`TP${i+1}: ${t}`]));
    if(T){aoa.push([],[`ANALISIS KETERCAPAIAN TP (KKTP ${K})`],['TP','Tujuan Pembelajaran','Rata-rata','% Tercapai','Kategori']);
      const old=db.aktif;db.aktif=k.id;analisis(m).forEach(a=>aoa.push([`TP${a.i+1}`,m.tp[a.i]||'',a.avg??'',a.p===null?'':a.p+'%',a.kat]));db.aktif=old}
    const ws=XLSX.utils.aoa_to_sheet(aoa),mg=[];
    const add=(r1,c1,r2,c2)=>{if(r2>r1||c2>c1)mg.push({s:{r:r1,c:c1},e:{r:r2,c:c2}})};
    [0,1,cSts,cSts+1,cNr,cDesc].forEach(c=>add(3,c,4,c));add(3,2,3,1+NF);if(T)add(3,cS,3,cS+T-1);
    ws['!merges']=mg;ws['!cols']=[{wch:6},{wch:32},...R(NF+T+3,{wch:8}),{wch:60}];
    let nm=(k.nama+' '+m.nama).replace(/[\\\/\?\*\[\]:]/g,'').slice(0,28),i=1,base=nm;
    while(used.has(nm))nm=base.slice(0,25)+'-'+(++i);used.add(nm);
    XLSX.utils.book_append_sheet(wb,ws,nm);
  });
  ks.forEach(k=>{
    const sl=db.siswa.filter(x=>x.kelasId===k.id).sort((a,b)=>a.nama.localeCompare(b.nama)),as=aspekKelas(k.id);
    if(!sl.length||!as.length)return;
    const aoa=[['PENILAIAN SIKAP'],[`Kelas: ${k.nama}  |  ${periodeLabel(db.periode.find(x=>x.id===k.pid))}`],[],['No','Nama Siswa',...as.map(a=>a.nama),'Predikat','Deskripsi']];
    sl.forEach((x,i)=>{const d=getS(x.id),f=sikapInfo(k.id,x.id);aoa.push([i+1,x.nama,...as.map(a=>d[a.id]?LV[d[a.id]][0]:''),f.p?LV[f.p][1]:'',f.p||d.cat?f.desk:''])});
    aoa.push([],['Ket: SB = Sangat Baik, B = Baik, C = Cukup, PB = Perlu Bimbingan']);
    const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:6},{wch:32},...as.map(()=>({wch:14})),{wch:16},{wch:70}];
    let nm=('Sikap '+k.nama).replace(/[\\\/\?\*\[\]:]/g,'').slice(0,28),j=1,b=nm;
    while(used.has(nm))nm=b.slice(0,25)+'-'+(++j);used.add(nm);XLSX.utils.book_append_sheet(wb,ws,nm);
  });
  ks.forEach(k=>{
    const sl=db.siswa.filter(x=>x.kelasId===k.id).sort((a,b)=>a.nama.localeCompare(b.nama)),P=db.pres[k.id]||{},dates=Object.keys(P).filter(t=>Object.keys(P[t]).length).sort();
    if(!sl.length||!dates.length)return;
    const aoa=[['REKAP PRESENSI'],[`Kelas: ${k.nama}  |  ${periodeLabel(db.periode.find(x=>x.id===k.pid))}`],[],['No','Nama Siswa',...dates.map(t=>t.slice(8)+'/'+t.slice(5,7)),'H','S','I','A','% Hadir']];
    sl.forEach((x,i)=>{const c=presRekap(k.id,x.id),t=c.H+c.S+c.I+c.A;aoa.push([i+1,x.nama,...dates.map(t2=>P[t2][x.id]||''),c.H,c.S,c.I,c.A,t?Math.round(c.H/t*100)+'%':''])});
    aoa.push([],['Ket: H = Hadir, S = Sakit, I = Izin, A = Alpa']);
    const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:6},{wch:32},...dates.map(()=>({wch:6})),{wch:5},{wch:5},{wch:5},{wch:5},{wch:9}];
    let nm=sheetNm('Presensi '+k.nama),j=1,b=nm;while(used.has(nm))nm=b.slice(0,25)+'-'+(++j);used.add(nm);XLSX.utils.book_append_sheet(wb,ws,nm);
  });
  await berkas('rekap-nilai-raport-evalo.xlsx',XLSX.write(wb,{type:'base64',bookType:'xlsx'}));
}
async function berkas(name,b64,mime='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'){
  try{
    const C=window.Capacitor;
    if(C&&C.isNativePlatform&&C.isNativePlatform()){
      const FS=C.Plugins.Filesystem,SH=C.Plugins.Share;
      const r=await FS.writeFile({path:name,data:b64,directory:'CACHE'});
      await SH.share({title:name,url:r.uri,dialogTitle:'Simpan atau kirim file'});
    }else{
      const a=document.createElement('a');a.href='data:'+mime+';base64,'+b64;a.download=name;a.click();
    }
  }catch(err){if(!/cancel/i.test(String(err&&err.message)))toast('Gagal menyimpan file')}
}
/* ===== Template & upload nilai ===== */
function templateNilai(){
  const m=mapelKelas().find(x=>x.id===db.mapelAktif),sl=siswaKelas();if(!m)return toast('Pilih mata pelajaran dulu');
  const T=m.tp.length,v=x=>num(x)??'';
  const head=['No','Nama Siswa',...Array.from({length:NF},(_,i)=>'F'+(i+1)),...m.tp.map((_,i)=>'TP'+(i+1)),'STS','SAS'];
  const rows=sl.map((x,i)=>{const n=getN(m.id,x.id);return [i+1,x.nama,...Array.from({length:NF},(_,j)=>v(n.f[j])),...m.tp.map((_,j)=>v(n.t[j])),v(n.sts),v(n.sas)]});
  const ws=XLSX.utils.aoa_to_sheet([head,...rows]);ws['!cols']=[{wch:5},{wch:32},...Array(NF+T+2).fill({wch:7})];
  const info=XLSX.utils.aoa_to_sheet([['Petunjuk'],['1. Isi nilai 0-100 pada sheet Nilai. Jangan ubah judul kolom dan nama siswa.'],['2. F1-F6 = Formatif, TP = Sumatif tiap TP, STS, SAS.'],['3. Kolom kosong tidak mengubah nilai yang sudah ada di aplikasi.'],['4. NR dihitung otomatis oleh aplikasi.'],[],['Mata pelajaran: '+m.nama],...m.tp.map((t,i)=>['TP'+(i+1)+': '+t])]);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Nilai');XLSX.utils.book_append_sheet(wb,info,'Petunjuk');
  return berkas('template-nilai-'+m.nama.replace(/[^\w-]+/g,'_')+'.xlsx',XLSX.write(wb,{type:'base64',bookType:'xlsx'}));
}
async function uploadNilai(f){
  const m=mapelKelas().find(x=>x.id===db.mapelAktif);if(!m)return toast('Pilih mata pelajaran dulu');
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    let hi=-1;for(let i=0;i<Math.min(rows.length,10);i++){if(rows[i].some(x=>/^nama/i.test(String(x).trim()))){hi=i;break}}
    if(hi<0)return toast('Kolom Nama Siswa tidak ditemukan. Gunakan template dari aplikasi.');
    const map=[];let nc=-1;
    rows[hi].forEach((h0,c)=>{const h=String(h0).trim();let r;
      if(/^nama/i.test(h))nc=c;
      else if(r=/^F\s*(\d)$/i.exec(h)){if(+r[1]>=1&&+r[1]<=NF)map.push([c,'f',+r[1]-1])}
      else if(r=/^TP\s*(\d+)$/i.exec(h)){if(+r[1]>=1&&+r[1]<=m.tp.length)map.push([c,'t',+r[1]-1])}
      else if(/^sts$/i.test(h))map.push([c,'sts'])
      else if(/^sas$/i.test(h))map.push([c,'sas'])});
    const by=new Map(siswaKelas().map(x=>[x.nama.trim().toLowerCase(),x]));let ok=0,miss=0;
    rows.slice(hi+1).forEach(r=>{
      const nm=String(r[nc]||'').trim();if(!nm)return;const x=by.get(nm.toLowerCase());if(!x){miss++;return}
      const key=m.id+'|'+x.id,n=db.nilai[key]=db.nilai[key]||{f:[],t:[]};
      map.forEach(([c,j,i])=>{const raw=r[c];if(raw===''||raw==null)return;const v=Number(String(raw).replace(',','.'));if(isNaN(v))return;
        const val=String(Math.min(100,Math.max(0,Math.round(v*100)/100)));if(j==='f')n.f[i]=val;else if(j==='t')n.t[i]=val;else n[j]=val});
      ok++;
    });
    save();render();toast(`${ok} siswa diperbarui${miss?', '+miss+' nama tidak cocok':''}`);
  }catch(err){toast('File tidak bisa dibaca')}
}

/* ===== Cadangan ===== */
async function cadangkan(){
  db.lastBackup=Date.now();save();
  const b64=btoa(unescape(encodeURIComponent(JSON.stringify(db))));
  await berkas('evalo-cadangan-'+hariIni()+'.json',b64,'application/json');
  render();
}
async function pulihkan(f){
  try{
    const o=JSON.parse(await f.text());
    if(!o||!Array.isArray(o.kelas)||!Array.isArray(o.siswa)||!Array.isArray(o.mapel))return toast('Ini bukan file cadangan EVALO');
    if(!confirm('Semua data di aplikasi saat ini akan diganti dengan isi file cadangan. Lanjutkan?'))return;
    db=o;migrasi();save();render();toast('Data berhasil dipulihkan');
  }catch(err){toast('File cadangan tidak bisa dibaca')}
}

/* ===== Cetak rapor (PDF) ===== */
async function buatRapor(){
  if(!window.jspdf)return toast('Library PDF belum termuat');
  const k=kelasAktif(),sl=siswaKelas(),ml=mapelKelas(),pr=periodeAktif(),pf=db.profil||{};
  if(!sl.length)return toast('Belum ada siswa di kelas ini');
  if(!ml.length)return toast('Belum ada mata pelajaran');
  const pilih=db.raporSiswa&&db.raporSiswa!=='all'?sl.filter(x=>x.id===db.raporSiswa):sl;
  if(!pilih.length)return toast('Siswa tidak ditemukan');
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),tgl=tglIndo();
  const tebal=()=>doc.setFont('helvetica','bold'),normal=()=>doc.setFont('helvetica','normal');
  pilih.forEach((x,ix)=>{
    if(ix)doc.addPage();
    let y=16;
    const need=h=>{if(y+h>282){doc.addPage();y=16}};
    tebal();doc.setFontSize(14);doc.text('LAPORAN HASIL BELAJAR',105,y,{align:'center'});
    y+=6;doc.setFontSize(11);doc.text((pf.sekolah||'NAMA SEKOLAH').toUpperCase(),105,y,{align:'center'});
    y+=3;doc.setLineWidth(.5);doc.line(15,y,195,y);
    y+=7;normal();doc.setFontSize(10);
    [['Nama Siswa',x.nama,'Semester',pr.sem],['Kelas',k.nama,'Tahun Ajaran',pr.tahun]].forEach(r=>{doc.text(r[0],15,y);doc.text(': '+r[1],42,y);doc.text(r[2],120,y);doc.text(': '+r[3],148,y);y+=5.5});
    y+=3;tebal();doc.text('A. Capaian Kompetensi',15,y);
    doc.autoTable({startY:y+2,head:[['No','Mata Pelajaran','Nilai Akhir','Capaian Kompetensi']],
      body:ml.map((m,i)=>{const nr=hitungNR(getN(m.id,x.id));return [i+1,m.nama,nr===''?'-':nr,deskripsi(m,x)]}),
      theme:'grid',styles:{fontSize:8.5,cellPadding:2,valign:'top'},headStyles:{fillColor:[18,53,91]},
      columnStyles:{0:{cellWidth:10,halign:'center'},1:{cellWidth:38},2:{cellWidth:20,halign:'center'}},margin:{left:15,right:15}});
    y=doc.lastAutoTable.finalY+8;need(60);
    tebal();doc.setFontSize(10);doc.text('B. Sikap',15,y);
    const as=aspekKelas(k.id),d=getS(x.id),f=sikapInfo(k.id,x.id);
    doc.autoTable({startY:y+2,head:[['No','Aspek Sikap','Predikat']],
      body:[...as.map((a,i)=>[i+1,a.nama,d[a.id]?LV[d[a.id]][1]:'-']),['','Predikat keseluruhan',f.p?LV[f.p][1]:'-'],[{content:'Deskripsi: '+f.desk,colSpan:3}]],
      theme:'grid',styles:{fontSize:8.5,cellPadding:2},headStyles:{fillColor:[18,53,91]},
      columnStyles:{0:{cellWidth:10,halign:'center'},2:{cellWidth:40}},margin:{left:15,right:15}});
    y=doc.lastAutoTable.finalY+8;need(40);
    const c=presRekap(k.id,x.id);
    tebal();doc.setFontSize(10);doc.text('C. Ketidakhadiran',15,y);
    doc.autoTable({startY:y+2,head:[['Keterangan','Jumlah']],body:[['Sakit',c.S+' hari'],['Izin',c.I+' hari'],['Tanpa keterangan',c.A+' hari']],
      theme:'grid',tableWidth:80,styles:{fontSize:8.5,cellPadding:2},headStyles:{fillColor:[18,53,91]},margin:{left:15}});
    y=doc.lastAutoTable.finalY+10;need(80);
    normal();doc.setFontSize(10);
    doc.text(`${pf.kota||'.........'}, ${tgl}`,160,y,{align:'center'});y+=5.5;
    doc.text('Orang Tua/Wali',40,y,{align:'center'});doc.text('Wali Kelas',160,y,{align:'center'});
    y+=24;doc.text('(....................)',40,y,{align:'center'});
    tebal();doc.text(pf.guru||'(....................)',160,y,{align:'center'});normal();
    if(pf.nipguru){y+=5;doc.text('NIP. '+pf.nipguru,160,y,{align:'center'})}
    y+=12;doc.text('Mengetahui,',105,y,{align:'center'});y+=5;doc.text('Kepala Sekolah',105,y,{align:'center'});
    y+=24;tebal();doc.text(pf.kepsek||'(....................)',105,y,{align:'center'});normal();
    if(pf.nipkepsek){y+=5;doc.text('NIP. '+pf.nipkepsek,105,y,{align:'center'})}
    doc.setFontSize(8);doc.setTextColor(130);doc.text('Dibuat dengan EVALO. '+CREDIT,105,291,{align:'center'});doc.setTextColor(0);
  });
  const nama='rapor-'+(pilih.length===1?pilih[0].nama:k.nama).replace(/[^\w-]+/g,'_')+'.pdf';
  await berkas(nama,doc.output('datauristring').split(',')[1],'application/pdf');
}

/* ===== Mulai ===== */
$('#splash').innerHTML=`${LOGO}<h1>EVALO</h1><p>${TAG}</p><small>${CREDIT}</small>`;
$('#splash').onclick=()=>$('#splash').classList.add('out');
setTimeout(()=>$('#splash').classList.add('out'),2600);
migrasi();render();
