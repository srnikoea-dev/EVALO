name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - name: Salin library Excel dan PDF (agar jalan offline)
        run: |
          cp node_modules/xlsx/dist/xlsx.full.min.js www/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/
          cp node_modules/jspdf-autotable/dist/jspdf.plugin.autotable.min.js www/
      - run: npx cap add android
      - name: Set nama aplikasi menjadi EVALO
        run: sed -i 's|<string name="app_name">.*</string>|<string name="app_name">EVALO</string>|; s|<string name="title_activity_main">.*</string>|<string name="title_activity_main">EVALO</string>|' android/app/src/main/res/values/strings.xml
      - run: npx cap sync android
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: nilai-siswa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
